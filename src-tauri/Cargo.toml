[package]
name = "contour-linea"
version = "1.1.0"
description = "ContourLinea — a lightweight SVG viewer & toolkit built with Tauri v2 + TypeScript"
authors = ["Oceaniat"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Tauri 应用需要 lib 形式的入口（供桌面/移动端复用）
[lib]
name = "contour_linea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
flate2 = "1"
base64 = "0.23"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
