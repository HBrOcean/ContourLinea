<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <rect width="420" height="300" fill="#0b1220" />

  <!-- SMIL 动画：旋转的轨道环 -->
  <g transform="translate(210 150)">
    <circle r="90" fill="none" stroke="#1f2b47" stroke-width="2" stroke-dasharray="6 10" />
    <circle r="60" fill="none" stroke="#27355a" stroke-width="2" stroke-dasharray="4 8" />
    <g>
      <circle cx="90" cy="0" r="10" fill="#4c8dff" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </g>
    <g>
      <circle cx="60" cy="0" r="7" fill="#22d3ee" />
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- SMIL 动画：呼吸的圆心 -->
  <circle cx="210" cy="150" r="22" fill="#a855f7">
    <animate attributeName="r" values="22;30;22" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- SMIL 动画：进度环描边 -->
  <g transform="translate(60 60)">
    <circle r="26" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="163.4" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="163.4;0;163.4" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- SMIL 动画：脉冲点 -->
  <g fill="#6ea8ff">
    <rect x="330" y="230" width="10" height="10" rx="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0s" repeatCount="indefinite" />
    </rect>
    <rect x="350" y="230" width="10" height="10" rx="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
    </rect>
    <rect x="370" y="230" width="10" height="10" rx="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="210" y="282" font-size="14" text-anchor="middle" fill="#64748b" font-family="sans-serif">SMIL animation sample</text>
</svg>
