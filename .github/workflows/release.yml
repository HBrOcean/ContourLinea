name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ContourLinea ${{ github.ref_name }}'
          releaseBody: |
            基于 Tauri v2 的 SVG 预览器 ContourLinea。

            下载对应平台安装包即可：Windows(.msi/.exe) / macOS(.dmg) / Linux(.AppImage/.deb)

            自动更新与代码签名配置见 docs/ 目录。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ⑯ 汇总校验和 + 变更日志，附加到 Release
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Generate SHA256SUMS and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          # 展平所有平台的安装包
          find bundles -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' \) \
            -exec cp {} release/ \; || true
          if compgen -G "release/*" > /dev/null; then
            (cd release && sha256sum * > SHA256SUMS.txt)
          else
            echo "no bundle files found" && exit 0
          fi

          # changelog：上一个 tag 到当前 tag 的提交
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changelog"
            echo
            if [ -n "${PREV}" ]; then
              git log --oneline --no-decorate "${PREV}..${TAG}"
            else
              git log --oneline --no-decorate "${TAG}"
            fi
            echo
            echo "## 校验和"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > changelog.md

      - name: Upload checksums & update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release upload "${TAG}" release/SHA256SUMS.txt --clobber
          # 合并：原 notes + changelog/校验和
          gh release view "${TAG}" --json body -q .body > /tmp/old-notes.md || echo "" > /tmp/old-notes.md
          cat /tmp/old-notes.md changelog.md > /tmp/notes.md
          gh release edit "${TAG}" --notes-file /tmp/notes.md
