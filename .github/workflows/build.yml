name: Build

on:
  # 只对分支推送 / PR / 手动触发；tag 由 release.yml 负责构建并发布，
  # 避免打 tag 时两套 workflow 各跑一遍多平台构建（白等一倍时间）
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⑮ 静态检查：TS 类型 + Rust 格式 + Clippy
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain (fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # tauri-build 编译期会校验 frontendDist（../dist）是否存在，必须先构建前端
      - name: Build frontend
        run: npx vite build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        # 首次接入先只输出警告、不阻断构建；告警清零后可改为 `cargo clippy --all-targets -- -D warnings` 并移除 continue-on-error
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: Rust unit tests
        working-directory: src-tauri
        # 首次接入：测试编译失败只告警，不阻断后续多平台构建
        continue-on-error: true
        run: cargo test --lib

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            tag: Windows-x64
            args: ''
          - platform: ubuntu-22.04
            tag: Linux-x64
            args: ''
          - platform: macos-latest
            tag: macOS-ARM64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            tag: macOS-x64
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contour-linea-${{ matrix.tag }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
